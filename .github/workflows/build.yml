name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest

      - name: Compilar APK
        run: ./gradlew assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: zairauto-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      # Publica el APK en "Releases" con un enlace fijo:
      # https://github.com/<usuario>/<repo>/releases/latest/download/Zairauto.apk
      - name: Publicar en Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Zairauto.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Zairauto.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Zairauto (última versión)" \
            --notes "Descarga **Zairauto.apk** de aquí abajo y ábrelo en el móvil para instalarlo. Compilado desde ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
