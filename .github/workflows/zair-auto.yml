# Compila Zair Auto (carpeta Zair-Auto/, fork de Fermata) y publica el APK.
name: Zair Auto APK

on:
  push:
    paths:
      - "Zair-Auto/**"
      - ".github/workflows/zair-auto.yml"
  pull_request:
    paths:
      - "Zair-Auto/**"
      - ".github/workflows/zair-auto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zair-auto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Zair-Auto
    env:
      NO_GS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' > /dev/null || true
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

      # Opcional: con los secretos CI_KEYSTORE (keystore en base64), CI_ALIAS, CI_KEY_PWD y
      # CI_KEYSTORE_PWD el APK se firma con tu clave y se instala como actualización.
      # Sin ellos se firma con una clave nueva de prueba.
      - name: Restaurar clave de firma
        env:
          CI_KEYSTORE: ${{ secrets.CI_KEYSTORE }}
          CI_ALIAS: ${{ secrets.CI_ALIAS }}
          CI_KEY_PWD: ${{ secrets.CI_KEY_PWD }}
          CI_KEYSTORE_PWD: ${{ secrets.CI_KEYSTORE_PWD }}
        run: |
          if [ -n "$CI_KEYSTORE" ]; then
            printf '%s' "$CI_KEYSTORE" | base64 --decode > ci-signing.jks
            printf 'storeFile=%s/ci-signing.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' "$PWD" "$CI_ALIAS" "$CI_KEY_PWD" "$CI_KEYSTORE_PWD" > local.properties
          fi

      - name: Comprobaciones
        run: bash verification/run-checks.sh

      - name: Compilar APK universal ARM64
        run: |
          chmod +x gradlew
          ./gradlew fermata:packageAutoReleaseUniversalApk -PZAIR_CORE=true -PABI=arm64-v8a -PAPP_NAME='Zair Auto' --no-daemon
          cp fermata/build/outputs/apk_from_bundle/autoRelease/*.apk Zair-Auto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zair-Auto-arm64
          path: Zair-Auto/Zair-Auto.apk
          if-no-files-found: error
          retention-days: 30

      # Enlace fijo: https://github.com/<usuario>/<repo>/releases/download/zair-auto/Zair-Auto.apk
      - name: Publicar en Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete zair-auto --yes --cleanup-tag || true
          gh release create zair-auto Zair-Auto.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Zair Auto (última compilación)" \
            --notes "APK de Zair Auto compilado desde ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Descarga **Zair-Auto.apk** e instálalo en el móvil."
