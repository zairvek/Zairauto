# Zair Auto changes dated 2026-10-14. GPL-3.0.
name: Zair Auto APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_GS: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' > /dev/null || true
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Restore optional signing key
        env:
          CI_KEYSTORE: ${{ secrets.CI_KEYSTORE }}
          CI_ALIAS: ${{ secrets.CI_ALIAS }}
          CI_KEY_PWD: ${{ secrets.CI_KEY_PWD }}
          CI_KEYSTORE_PWD: ${{ secrets.CI_KEYSTORE_PWD }}
        run: |
          if [ -n "$CI_KEYSTORE" ]; then
            printf '%s' "$CI_KEYSTORE" | base64 --decode > ci-signing.jks
            printf 'storeFile=%s/ci-signing.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' "$PWD" "$CI_ALIAS" "$CI_KEY_PWD" "$CI_KEYSTORE_PWD" > local.properties
          fi
      - name: Check regression cases
        run: bash verification/run-checks.sh
      - name: Build universal ARM64 APK
        run: |
          chmod +x gradlew
          ./gradlew fermata:packageAutoReleaseUniversalApk -PZAIR_CORE=true -PABI=arm64-v8a -PAPP_NAME='Zair Auto' --no-daemon
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Zair-Auto-arm64
          path: fermata/build/outputs/apk_from_bundle/autoRelease/*.apk
          if-no-files-found: error
          retention-days: 30
